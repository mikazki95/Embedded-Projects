# devg-mq200.so parameters for tailoring to specific boards and display modes.
#
# fpx		Flat panel X resolution	
# fpy 		Flat panel Y resolution	
# fpr		Flat panel refresh rate (Hz)	
# fpcon		Flat Panel Control register setting*	
# fppincon	Flat Panel Pin Control register setting*	
# stncon	STN Panel Control register setting*	
# regbase	Memory Mapped register base address	
# fbbase	Frame Buffer Base Address	
# crton		CRT Display on(1) or off(0)
#
# * see M200 register documentation, available from mediaQ (www.mediaq.com)
# A regbase of 1 indicates a pci card, and base addresses should come from
# PCI server
#
# The driver will use the first un-commented entry.


# NEC 10.4" TFT Color LCD Module (NL6448AC33-18A) 
fpx=640,fpy=480,fpr=60,fpcon=0x6320,fppincon=0x20,stncon=0x00bd001,regbase=1,fbbase=0,crton=1 
