PNPCMD=PCL

#----------------------------------------------------------------------
#
# The following macros are expanded for each filter command line
# $d - Device
# $m - PnP manufacture/model id
# $n - Printer name
# $s - Spooldir name
# $$ - A real $
#
#----------------------------------------------------------------------

FileVersion				=	2
Filter					=	phs:$d:phs-to-pcl -m$m
Filter					=	raw:$d:cat

Supported Resolution	=	 75 *  75,
							150 * 150,
							300 * 300

Supported PaperSize		=	8500 * 11000 : Letter,
							8500 * 14000 : Legal

Supported Dithering		=	4 : "QNX dither",
							5 : "Error diffusion",
							6 : Halftone

Supported Orientation	=	0 : Portrait,
							1 : Landscape

Supported Intensity		=	0   : Min,
							100 : Max

Supported InkType		=   1 : "B&W",
							3 : "Color (CMY)",
							4 : "Color (CMYK)"

Resolution				=	300 * 300
PaperSize				=	8500 * 11000 : Letter
Dithering				=	4 : "QNX dither"
Orientation				=	0 : Portrait
Intensity				=	50
InkType					=	1 : "B&W"
NonPrintable			=	500:Left, 500:Top, 500:Right, 500:Bottom

#----------------------------------------------------------------------

if PNPID=HEWLETT-PACKARDDESKJ8D3A
PNPSTR=MFG:HEWLETT-PACKARD;MDL:DESKJET 400;CLS:PRINTER;CMD:PCL;

Supported InkType		=   1 : "B&W",
							3 : "Color (CMY)"

InkType					=   3 : "Color (CMY)"

#----------------------------------------------------------------------

if PNPID=HEWLETT-PACKARDDESKJ4D9B
PNPSTR=MFG:HEWLETT-PACKARD;MDL:DESKJET 600;CLS:PRINTER;CMD:PCL;

Supported InkType		=   1 : "B&W",
							3 : "Color (CMY)",
							4 : "Color (CMYK)",
							6 : "Color (Neon)"

#----------------------------------------------------------------------

if PNPID=HEWLETT-PACKARDDESKJ70CE
PNPSTR=MFG:HEWLETT-PACKARD;MDL:DESKJET 880C;CLS:PRINTER;CMD:MLC,PCL,PML;

#----------------------------------------------------------------------

if PNPID=HEWLETT-PACKARDDESKJ8FFF
PNPSTR=MFG:HEWLETT-PACKARD;MDL:DESKJET 970C;CLS:PRINTER;CMD:MLC,PCL,PML;

Supported Duplex        =   0:Off, 1:On

Duplex                  =   0:Off

#----------------------------------------------------------------------

if PNPID=HEWLETT-PACKARDHP_25A854
PNPSTR=MFG:HEWLETT-PACKARD;MDL:HP 2500C;CLS:PRINTER;CMD:PCL,MLC,PML,POSTSCRIPT;

Supported PaperSize     =   8500  *  11000 : Letter,
							8500  *  14000 : Legal,
							7250  *  10500 : Exec,
							11000 *  17000 : B,
							8262  *  11692 : A4,
							5846  *   8262 : A5,
							7000  *   9875 : B5,
							11692 *  16524 : A3

